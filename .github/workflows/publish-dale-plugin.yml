name: Publish Dale Plugin to npm

on:
  push:
    branches:
      - main
    paths:
      - "casita-dale-plugin/**"

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: casita-dale-plugin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run type-check

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
